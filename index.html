<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>WhatsApp Bot Test</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #111;
    color: white;
}

.container {

    width: 90%;
    max-width: 400px;

    background: #1c1c1c;

    padding: 30px;

    border-radius: 15px;

    text-align: center;

    border: 1px solid #333;
}

h1 {
    margin-bottom: 25px;
}

input {

    width: 100%;

    padding: 14px;

    border-radius: 8px;

    border: none;

    margin-bottom: 15px;

    font-size: 16px;
}

button {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 8px;

    background: #25D366;

    color: white;

    font-size: 16px;

    cursor: pointer;
}

button:hover {
    opacity: 0.8;
}

.code {

    margin-top: 25px;

    padding: 15px;

    background: #111;

    border-radius: 10px;

    font-size: 25px;

    letter-spacing: 3px;

    color: #25D366;

    word-break: break-all;
}

.status {

    margin-top: 15px;

    color: #aaa;
}

</style>

</head>

<body>

<div class="container">

<h1>WhatsApp Bot</h1>

<input
id="number"
placeholder="923001234567"
type="text">

<button onclick="generateCode()">
Generate Pairing Code
</button>

<div
class="code"
id="code">

Waiting...

</div>

<div
class="status"
id="status">

Status: Disconnected

</div>

</div>

<script>

async function generateCode() {

    const number =
        document.getElementById("number").value;

    const code =
        document.getElementById("code");

    if (!number) {

        code.innerText =
            "Enter Number";

        return;
    }

    code.innerText =
        "Generating...";

    try {

        const response =
            await fetch("/pair", {

                method: "POST",

                headers: {
                    "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                    number: number
                })

            });

        const data =
            await response.json();

        if (data.success) {

            code.innerText =
                data.pairingCode;

        } else {

            code.innerText =
                data.message;

        }

    } catch (error) {

        code.innerText =
            "Error";

    }
}


async function checkStatus() {

    try {

        const response =
            await fetch("/status");

        const data =
            await response.json();

        document
        .getElementById("status")
        .innerText =
            "Status: " + data.status;

    } catch (error) {}

}

setInterval(checkStatus, 3000);

checkStatus();

</script>

</body>

</html>
