<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MA CRASHER</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #0a0a0a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #111; border: 1px solid #222; border-radius: 20px; padding: 40px; width: 90%; max-width: 400px; text-align: center; }
        .card img { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 20px; border: 2px solid #ff4757; }
        .card h1 { color: #ff4757; margin-bottom: 10px; font-size: 2rem; }
        .card p { color: #888; margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; }
        .input-group input { width: 100%; padding: 15px; background: #0a0a0a; border: 1px solid #222; border-radius: 10px; color: #fff; font-size: 1rem; outline: none; }
        .input-group input:focus { border-color: #ff4757; }
        .btn { width: 100%; padding: 15px; background: #ff4757; color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #ff6b81; }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        #status { margin-top: 20px; padding: 10px; border-radius: 10px; display: none; font-size: 0.9rem; }
        .success { background: rgba(46,213,115,0.1); color: #2ed573; }
        .error { background: rgba(255,71,87,0.1); color: #ff4757; }
        #codeDisplay { margin-top: 20px; padding: 20px; background: #0a0a0a; border: 1px dashed #ff4757; border-radius: 10px; font-size: 2rem; font-weight: bold; color: #ff4757; display: none; cursor: pointer; }
        footer { margin-top: 20px; font-size: 0.8rem; color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://i.postimg.cc/050FQZ89/Chat-GPT-Image-Aug-26-2026-03-07-12-PM.png" alt="MA CRASHER">
        <h1>MA CRASHER</h1>
        <p>WhatsApp Bot</p>
        <div class="input-group">
            <input type="tel" id="phone" placeholder="Enter WhatsApp number (e.g. 923000000000)">
        </div>
        <button class="btn" id="requestPairing">Connect WhatsApp</button>
        <div id="status"></div>
        <div id="codeDisplay" onclick="copyCode()"><span id="pairingCode">0000 0000</span></div>
        <footer>© MA Developers | Muhammad Ayan</footer>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const phoneInput = document.getElementById('phone');
        const requestBtn = document.getElementById('requestPairing');
        const statusEl = document.getElementById('status');
        const codeDisplay = document.getElementById('codeDisplay');
        const pairingCode = document.getElementById('pairingCode');

        function setStatus(msg, type) {
            statusEl.textContent = msg;
            statusEl.className = type;
            statusEl.style.display = 'block';
        }

        // Socket Connect Check
        socket.on('connect', () => {
            console.log('Socket connected!');
        });

        socket.on('disconnect', () => {
            console.log('Socket disconnected!');
            setStatus('Connection lost! Please refresh.', 'error');
        });

        // Button Click Handler
        requestBtn.addEventListener('click', () => {
            const number = phoneInput.value.replace(/\D/g, '');
            if (!number || number.length < 10) {
                setStatus('Please enter a valid number!', 'error');
                return;
            }
            requestBtn.textContent = 'Connecting...';
            setStatus('Connecting to WhatsApp...', 'success');
            const userId = 'user_' + Math.random().toString(36).substr(2, 9);
            socket.emit('set-user', userId);
            socket.emit('pair-request', { userId, number });
        });

        socket.on('pairing-code', (code) => {
            requestBtn.textContent = 'Connect WhatsApp';
            setStatus('Pairing code generated!', 'success');
            codeDisplay.style.display = 'block';
            pairingCode.textContent = code;
        });

        socket.on('pair-error', (msg) => {
            requestBtn.textContent = 'Connect WhatsApp';
            setStatus(msg || 'Error!', 'error');
        });

        socket.on('connection-status', (status) => {
            if (status && status.connected) {
                setStatus('✅ Connected! Bot is active!', 'success');
                setTimeout(() => location.reload(), 3000);
            }
        });

        function copyCode() {
            const code = pairingCode.textContent;
            if (code !== '0000 0000') navigator.clipboard.writeText(code.replace(/\s/g, ''));
        }
    </script>
</body>
</html>
